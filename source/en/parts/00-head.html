<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual-Brain System · A Multi-Model Collaborative Cognition Framework (Version 2.1)</title>
<meta name="description" content="An engineering-oriented technical proposal: drawing on encoding, consolidation, retrieval, reconsolidation, forgetting, working memory, value-based decision-making, and social relationship memory from neuroscience, it designs a Dual-Brain System in which multiple large models divide the labor and collaborate.">
<meta name="author" content="DSH · Dual-Brain System Proposal">
<style>
:root{
  --paper:#f7f3ea; --paper-2:#efe8d9; --paper-3:#e7dfcd;
  --ink:#1a1917; --ink-2:#3d3932; --muted:#756d5f; --faint:#9a9182; --rule:#d7cdb9;
  --teal:#0d5b55; --teal-2:#0a4641; --teal-soft:#e2ece8;
  --rust:#a4491f; --rust-soft:#f2e4da; --gold:#b08a3e;
  --night:#111d1c; --night-2:#1b2b29;
  --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
  --sans:"Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.9;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1100px 600px at 82% -8%,rgba(13,91,85,.06),transparent 60%),radial-gradient(900px 700px at -8% 32%,rgba(164,73,31,.05),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 30%);}
::selection{background:rgba(13,91,85,.18);}
a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(13,91,85,.28);}
a:hover{border-bottom-color:var(--teal);}
p{margin:0 0 1.05em;}
strong{font-weight:700;color:var(--ink);}
em{font-style:normal;color:var(--teal-2);border-bottom:1px dotted rgba(13,91,85,.4);}
sup{font-size:.62em;line-height:0;vertical-align:super;color:var(--muted);}
.wrap{max-width:820px;margin:0 auto;padding:0 32px;}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:transparent;}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .1s linear;}

/* cover */
.cover{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:64px 0 48px;border-bottom:1px solid var(--rule);}
.cover .wrap{position:relative;z-index:2;}
.kicker{font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);margin-bottom:30px;display:flex;align-items:center;gap:14px;}
.kicker::before{content:"";display:block;width:34px;height:1px;background:var(--rust);}
h1.title{font-size:76px;line-height:1.06;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;color:var(--ink);}
h1.title .thin{font-weight:400;color:var(--teal);}
.subtitle{font-size:23px;line-height:1.55;font-weight:400;color:var(--ink-2);margin:0 0 24px;letter-spacing:.01em;}
.deck{max-width:560px;font-size:16px;line-height:1.9;color:var(--muted);border-left:2px solid var(--gold);padding-left:18px;margin:0 0 34px;}
.cover-meta{font-family:var(--sans);font-size:12px;letter-spacing:.05em;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;}
.cover-meta b{font-weight:500;color:var(--ink-2);}
.cover .scheme{position:absolute;right:-40px;top:-20px;width:420px;height:420px;opacity:.55;pointer-events:none;}
.cover .scheme-cap{position:absolute;right:32px;bottom:24px;font-family:var(--sans);font-size:10px;letter-spacing:.18em;color:var(--faint);writing-mode:vertical-rl;}
.stat-strip{display:flex;flex-wrap:wrap;gap:0;margin:38px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.stat-strip div{flex:1 1 0;min-width:0;padding:14px 12px 12px 0;}
.stat-strip .n{font-family:var(--sans);font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--teal-2);display:block;line-height:1.2;}
.stat-strip .l{font-family:var(--sans);font-size:10px;letter-spacing:.13em;color:var(--muted);display:block;margin-top:4px;}

/* toc */
.toc{padding:58px 0 50px;border-bottom:1px solid var(--rule);}
.toc h2{font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:var(--rust);text-transform:uppercase;margin:0 0 24px;font-weight:500;}
.toc ol{list-style:none;margin:0;padding:0;columns:2;column-gap:48px;}
.toc li{break-inside:avoid;margin:0 0 10px;font-size:14px;line-height:1.6;}
.toc li .no{font-family:var(--sans);font-size:9.5px;letter-spacing:.08em;color:var(--faint);display:inline-block;width:28px;}
.toc li a{border:none;color:var(--ink-2);}
.toc li a:hover{color:var(--teal);}
.toc .part-row{font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--teal);margin:20px 0 7px;text-transform:uppercase;column-span:all;}
.toc .part-row:first-child{margin-top:0;}

/* part */
.part{background:var(--night);color:#f2ecdf;margin:0;padding:78px 0 66px;position:relative;overflow:hidden;break-before:page;}
.part .wrap{position:relative;z-index:2;}
.part .roman{font-family:var(--sans);font-size:12px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;margin-bottom:20px;}
.part h2{font-size:48px;line-height:1.15;margin:0 0 16px;font-weight:600;color:#f7f2e6;}
.part .part-deck{max-width:580px;font-size:15.5px;line-height:1.85;color:#b9c4bd;margin:0 0 30px;}
.part .part-list{display:flex;flex-wrap:wrap;gap:8px 26px;font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:#8fa39b;border-top:1px solid rgba(255,255,255,.16);padding-top:18px;}
.part .part-list span b{color:#e8dfc9;font-weight:500;}
.part .ghost{position:absolute;right:-16px;bottom:-64px;font-family:var(--sans);font-size:260px;font-weight:700;line-height:1;color:rgba(255,255,255,.035);letter-spacing:-.04em;pointer-events:none;}

/* sections */
main{padding:0 0 18px;}
section.sec{padding:52px 0 40px;border-bottom:1px solid var(--rule);}
section.sec:last-of-type{border-bottom:none;}
.sec-head{margin-bottom:26px;}
.sec-no{font-family:var(--sans);font-size:10px;letter-spacing:.25em;color:var(--rust);text-transform:uppercase;display:block;margin-bottom:10px;}
h2.sec-title{font-size:32px;line-height:1.35;font-weight:700;margin:0 0 9px;letter-spacing:-.01em;break-after:avoid;}
.sec-sub{font-size:14.5px;color:var(--muted);margin:0;font-family:var(--sans);letter-spacing:.02em;}
.lead{font-size:18.5px;line-height:1.85;color:var(--ink-2);}
.lead::first-letter{float:left;font-size:58px;line-height:.86;padding:5px 10px 0 0;color:var(--teal);font-weight:700;}
h3{font-size:20px;line-height:1.5;margin:34px 0 10px;font-weight:700;letter-spacing:-.005em;break-after:avoid;}
h4{font-size:15.5px;margin:24px 0 7px;font-weight:700;color:var(--teal-2);font-family:var(--sans);letter-spacing:.02em;break-after:avoid;}
.small{font-size:13.8px;color:var(--muted);line-height:1.8;}
.center{text-align:center;}
hr.sep{border:none;border-top:1px solid var(--rule);margin:34px 0;}

/* callouts */
.key{background:var(--night);color:#f3ede0;padding:24px 28px 22px;margin:30px -10px;position:relative;}
.key .tag{font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:9px;}
.key p{margin:0;font-size:15.5px;line-height:1.8;color:#e7e0d1;}
.key strong{color:#fff;}
.note{border-left:2px solid var(--teal);padding:2px 0 2px 18px;margin:24px 0;color:var(--ink-2);font-size:14.8px;}
.note .tag{font-family:var(--sans);font-size:10px;letter-spacing:.18em;color:var(--teal);display:block;margin-bottom:5px;text-transform:uppercase;}
.warn{background:var(--rust-soft);border-left:3px solid var(--rust);padding:16px 20px;margin:24px 0;font-size:14.5px;line-height:1.8;color:#4a2a19;}
.warn .tag{font-family:var(--sans);font-size:10px;letter-spacing:.18em;color:var(--rust);display:block;margin-bottom:5px;text-transform:uppercase;}
.pull{font-size:22px;line-height:1.55;color:var(--teal-2);font-weight:600;margin:32px 0;padding:0 0 0 22px;border-left:1px solid var(--gold);letter-spacing:-.01em;}
.pull span{display:block;font-size:11.5px;font-family:var(--sans);letter-spacing:.16em;color:var(--muted);margin-top:10px;font-weight:400;}

/* tables */
.table-wrap{margin:26px 0;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.2px;line-height:1.65;}
caption{caption-side:top;text-align:left;break-after:avoid;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--muted);padding-bottom:9px;text-transform:uppercase;}
th{text-align:left;font-family:var(--sans);font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:500;border-bottom:1px solid var(--ink);padding:8px 10px 7px;vertical-align:bottom;text-transform:uppercase;}
td{border-bottom:1px solid var(--rule);padding:9px 10px;vertical-align:top;color:var(--ink-2);}
tr:last-child td{border-bottom:1px solid var(--ink);}
td b{color:var(--ink);}
.tnum{font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:12.4px;}
table.compact{font-size:12.4px;}
table.compact th,table.compact td{padding:7px 8px;}

/* code */
pre.code{background:#141f1e;color:#dfe7df;padding:18px 20px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.65;margin:22px 0;border-left:3px solid var(--gold);}
pre.code .c{color:#8fa39b;}
code{font-family:var(--mono);font-size:.88em;background:rgba(13,91,85,.07);padding:1px 5px;color:var(--teal-2);}

/* lists */
ul.clean{list-style:none;padding:0;margin:0 0 1em;}
ul.clean li{position:relative;padding-left:20px;margin-bottom:9px;line-height:1.8;}
ul.clean li::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border:1px solid var(--teal);transform:rotate(45deg);}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 1em;}
ol.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:12px;line-height:1.8;}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:.12em;font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;color:var(--rust);}
.defs{display:block;margin:20px 0;}
.defs .row{display:flex;gap:20px;padding:10px 0;border-bottom:1px solid var(--rule);}
.defs .row:first-child{border-top:1px solid var(--rule);}
.defs .term{flex:0 0 148px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--teal-2);letter-spacing:.02em;}
.defs .desc{flex:1;font-size:14px;line-height:1.75;color:var(--ink-2);}

/* diagrams */
.diagram{margin:28px -8px;padding:22px 20px 18px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(239,232,217,.35));border:1px solid var(--rule);break-inside:avoid;}
.diagram .dtitle{font-family:var(--sans);font-size:10px;letter-spacing:.2em;color:var(--rust);text-transform:uppercase;margin-bottom:14px;}
.diagram .dnote{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:12px;font-family:var(--sans);}
.layer{display:flex;align-items:stretch;gap:12px;margin-bottom:10px;}
.layer .llabel{flex:0 0 92px;font-family:var(--sans);font-size:10px;letter-spacing:.12em;color:var(--teal-2);text-transform:uppercase;padding-top:12px;border-right:1px solid var(--rule);}
.layer .lbody{flex:1;display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-family:var(--sans);font-size:10.5px;letter-spacing:.02em;padding:7px 10px;background:#fff;border:1px solid var(--rule);color:var(--ink-2);line-height:1.3;}
.chip b{color:var(--teal-2);font-weight:600;}
.chip.rust{border-color:rgba(164,73,31,.35);background:var(--rust-soft);}
.chip.teal{border-color:rgba(13,91,85,.28);background:var(--teal-soft);}
.chip.dark{background:var(--night);color:#e8dfc9;border-color:var(--night);}
.chip.dark b{color:#f3ede0;}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;}
.flow .node{flex:1 1 0;min-width:96px;padding:10px 10px;background:#fff;border:1px solid var(--rule);font-family:var(--sans);font-size:10.5px;line-height:1.4;text-align:center;color:var(--ink-2);}
.flow .node b{display:block;font-size:9px;letter-spacing:.12em;color:var(--rust);margin-bottom:3px;}
.flow .ar{flex:0 0 auto;color:var(--faint);font-size:14px;}
.flow.six .node{min-width:0;padding:9px 6px;font-size:9.6px;}
.flow.vertical{flex-direction:column;align-items:stretch;}
.flow.vertical .ar{text-align:center;line-height:1;}
.flow.vertical .node{text-align:left;flex:0 0 auto;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.card{background:#fff;border:1px solid var(--rule);padding:11px 12px;}
.card .ct{font-family:var(--sans);font-size:10px;letter-spacing:.12em;color:var(--rust);text-transform:uppercase;margin-bottom:4px;}
.card .cb{font-size:12px;line-height:1.55;color:var(--ink-2);}
.card .cb b{color:var(--teal-2);}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.split .box{background:#fff;border:1px solid var(--rule);padding:12px 14px;}
.split .box h5{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;color:var(--teal-2);margin:0 0 6px;text-transform:uppercase;}
.split .box p{font-size:12.2px;line-height:1.6;margin:0;color:var(--ink-2);}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--sans);font-size:10px;color:var(--muted);margin-top:10px;}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12);}

/* refs */
.refs{font-size:12.6px;line-height:1.7;color:var(--ink-2);list-style:none;margin:0;padding:0;}
.refs li{margin-bottom:9px;padding-left:24px;text-indent:-24px;break-inside:avoid;}
.refs .idx{font-family:var(--sans);font-size:10px;color:var(--faint);display:inline-block;width:24px;text-indent:0;}
.refs i{font-style:italic;}
footer{padding:50px 0 62px;border-top:1px solid var(--rule);color:var(--muted);font-size:12.5px;line-height:1.75;}
footer .mark{font-family:var(--sans);font-size:10.5px;letter-spacing:.22em;color:var(--rust);text-transform:uppercase;margin-bottom:10px;}

/* print */
@page{size:A4;margin:19mm 17mm 17mm 17mm;@bottom-center{content:counter(page);font-family:var(--sans);font-size:8.5pt;color:#8a8173;letter-spacing:.1em;}@bottom-right{content:string(runhead);font-family:var(--sans);font-size:7.5pt;color:#a39a8b;letter-spacing:.08em;}}
@page:first{margin:0;@bottom-center{content:none;}@bottom-right{content:none;}}
@page part{size:A4;margin:0;background:var(--night);@bottom-center{content:none;}@bottom-right{content:none;}}
@page colophon{@bottom-right{content:none;}}
@media print{
  body{background:#fff;font-size:9.9pt;line-height:1.72;}
  p{margin-bottom:.8em;}
  script{display:none;}
  body::before{display:none;}
  .progress,.no-print{display:none!important;}
  .cover{min-height:auto;height:297mm;padding:0;border:none;page-break-after:always;background:var(--paper);}
  .cover .wrap{padding:0 22mm;display:flex;flex-direction:column;justify-content:center;height:100%;}
  h1.title{font-size:50pt;}
  .subtitle{font-size:15.5pt;}
  .deck{font-size:10.4pt;}
  .cover .scheme{opacity:.4;}
  .part{page:part;break-before:page;break-after:page;page-break-before:always;page-break-after:always;min-height:297mm;padding:68mm 22mm 0;background:var(--night)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .part .wrap{padding:0;max-width:166mm;}
  .part h2{font-size:31pt;}
  section.sec{padding:7mm 0 3mm;break-inside:auto;}
  h2.sec-title{font-size:18.5pt;break-after:avoid;}
  .sec-no{font-size:7.6pt;}
  .lead{font-size:10.8pt;}
  .lead::first-letter{float:none;font-size:1em;padding:0;color:inherit;font-weight:inherit;line-height:inherit;}
  h3{font-size:11.8pt;margin:6mm 0 1.8mm;break-after:avoid;}
  h4{font-size:10pt;margin:3.5mm 0 1mm;}
  .key,.warn,.note,.pull,figure,.diagram{break-inside:avoid;}
  .table-wrap{break-inside:auto;}
  tr{break-inside:avoid;}
  thead{display:table-header-group;}
  .key{margin:4.5mm 0;padding:4.5mm 5.5mm;}
  .key p{font-size:9.4pt;}
  .pull{margin:5mm 0;font-size:13pt;}
  .diagram{margin:4.5mm 0;padding:4mm 4mm 3mm;}
  .flow .node{font-size:7.6pt;padding:2mm 1.6mm;}
  .flow.six .node{font-size:6.9pt;padding:1.5mm 1.1mm;}
  .chip{font-size:7.4pt;padding:1.3mm 2mm;}
  .card{padding:2.4mm 2.6mm;}
  .card .cb{font-size:7.6pt;}
  table{font-size:7.9pt;}
  th{font-size:6.8pt;}
  table.compact{font-size:7.4pt;}
  .refs{font-size:8pt;line-height:1.5;}
  .toc{padding:5mm 0;break-after:page;}
  .toc h2{font-size:8pt;margin-bottom:5mm;}
  .toc ol{columns:1;}
  .toc li{font-size:9pt;margin-bottom:1.8mm;}
  .toc .part-row{font-size:7.8pt;margin:3.5mm 0 1.8mm;}
  .defs .row{break-inside:avoid;}
  footer{page:colophon;break-before:page;break-inside:avoid;padding:50mm 0 0;}
  a{color:var(--ink);border:none;}
  h2.sec-title{string-set:runhead content();}
  pre.code{font-size:7.6pt;padding:3.5mm 4mm;white-space:pre-wrap;overflow-wrap:anywhere;break-inside:avoid;}
}
@media (max-width:760px){
  body{font-size:16px;line-height:1.85;}
  .wrap{padding:0 20px;}
  .cover{min-height:92vh;padding:50px 0 36px;}
  h1.title{font-size:46px;}
  .subtitle{font-size:19px;}
  .deck{font-size:15px;margin-bottom:26px;}
  .cover .scheme{width:280px;height:280px;right:-130px;top:-60px;opacity:.4;}
  .stat-strip div{flex:1 1 50%;}
  .stat-strip .n{font-size:19px;}
  .toc ol{columns:1;}
  .part{padding:58px 0 50px;}
  .part h2{font-size:32px;}
  .part .ghost{font-size:170px;bottom:-36px;}
  h2.sec-title{font-size:25px;}
  .lead{font-size:17px;}
  .lead::first-letter{font-size:46px;}
  h3{font-size:18.5px;}
  .pull{font-size:19px;}
  .key{margin:26px 0;padding:20px 18px;}
  .defs .row{display:block;}
  .defs .term{margin-bottom:2px;}
  .cards{grid-template-columns:1fr;}
  .split{grid-template-columns:1fr;}
  .layer{display:block;}
  .layer .llabel{border-right:none;border-bottom:1px solid var(--rule);padding:0 0 5px;margin-bottom:8px;}
  .flow .node{min-width:100%;}
  .flow .ar{display:none;}
  table{font-size:12.2px;}
  th,td{padding:7px 7px;}
  .diagram{margin:24px 0;padding:16px 14px;}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
</head>
<body>
<div class="progress"><i id="bar"></i></div>
